name: CI/CD Pipeline - Cantinho do Saber

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: VALIDAÇÃO E TESTES (Obrigatório passar aqui primeiro)
  tests:
    name: Run Unit Tests & Validation
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Instala o PNPM (Gerenciador de pacotes que estamos usando)
      - name: Instalar PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 10.18.2

      # 3. Configura o Node.js v20
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # 4. Instala as dependências (igual ao seu computador)
      - name: Instalar Dependências
        run: pnpm install --no-frozen-lockfile

      # 5. Gera o Prisma Client
      # CRUCIAL: Sem isso, o TypeScript do backend falha antes de testar
      - name: Gerar Prisma Client
        run: pnpm db:generate

      # 6. Verifica erros de sintaxe e tipos (Build)
      - name: Verificar Compilação (Build)
        run: pnpm turbo run build

      # 7. EXECUTA OS TESTES (O passo principal do Dia 2)
      # Aqui ele roda o comando que acabamos de validar: "2 successful"
      - name: Executar Testes Unitários (Vitest)
        run: pnpm turbo run test

  # JOB 2: DOCKER (Só roda se os testes passarem)
  docker-build:
    name: Build & Run Docker
    runs-on: ubuntu-latest
    needs: tests  # <--- TRAVA DE SEGURANÇA: Espera o job 'tests' dar sucesso

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Instalar Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      # Cria um .env temporário para o Docker subir sem erros de variável
      - name: Criar arquivo .env
        run: |
          echo "POSTGRES_USER=admin" >> .env
          echo "POSTGRES_PASSWORD=admin" >> .env
          echo "POSTGRES_DB=escola-db" >> .env
          echo "DATABASE_URL=postgresql://admin:admin@database:5432/escola-db?schema=public" >> .env
          echo "JWT_SECRET=segredo_ci" >> .env
          echo "PORT=4000" >> .env
          echo "VITE_API_URL=http://localhost:4000" >> .env

      # Tenta subir os containers para provar que o Dockerfile funciona
      - name: Build e Up com Docker Compose
        run: docker-compose up --build -d

      - name: Verificar status dos containers
        run: docker-compose ps
